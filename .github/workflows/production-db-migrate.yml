name: Production DB Migration

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm production migration'
        required: true
        default: ''
  workflow_run:
    workflows:
      - Deploy to Vercel
    types:
      - completed
    branches:
      - main

env:
  NODE_VERSION: "22"

jobs:
  validate-inputs:
    name: Validate migration inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "migrate" ]; then
            echo "ERROR: confirmation string must be 'migrate'" >&2
            exit 1
          fi

  migrate:
    name: Run prisma migrate deploy
    needs: []
    if: |
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.confirm == 'migrate')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate required secrets
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "ERROR: PRODUCTION_DATABASE_URL secret is not set" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to production database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Validate schema applied
        run: |
          npx prisma db pull --force
          echo "Migration applied successfully"
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Production DB Migration Summary"
            echo "- **Run triggered by**: ${{ github.event_name }}"
            echo "- **Branch**: ${{ github.event.workflow_run.head_branch || github.ref_name }}"
            echo "- **SHA**: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "- **Status**: ${{ job.status }}"
            echo ""
            echo "### Next steps"
            echo "- Confirm \`/api/health\` returns 200 in production"
            echo "- Check Vercel deployment logs for Prisma errors"
          } >> "$GITHUB_STEP_SUMMARY"
