name: Load Test Baseline

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'k6 scenario to run (smoke | steady | ramp | spike | soak)'
        required: true
        default: 'smoke'
  schedule:
    # Run weekly on Sunday 03:00 UTC against staging
    - cron: '0 3 * * 0'

env:
  NODE_VERSION: "22"

jobs:
  load-test:
    name: k6 Load Test (${{ github.event.inputs.scenario || 'smoke' }})
    runs-on: ubuntu-latest
    environment: staging

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootwork_loadtest
          POSTGRES_USER: rootwork
          POSTGRES_PASSWORD: rootwork_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rootwork"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://rootwork:rootwork_load@localhost:5432/rootwork_loadtest?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST || 'pk_test_placeholder' }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST || 'sk_test_placeholder' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-placeholder' }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY_TEST || 'sk_test_placeholder' }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY_TEST || 'pk_test_placeholder' }}
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      N8N_WEBHOOK_SECRET: test_webhook_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BASE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Seed database
        run: npm run db:seed

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for app readiness
        run: npx wait-on http://localhost:3000/api/health --timeout 60000

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | \
            sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6 -y

      - name: Run k6 load test
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'smoke' }}"
          SCRIPT="tests/load/${SCENARIO}.js"
          if [ ! -f "$SCRIPT" ]; then
            echo "Script $SCRIPT not found, using steady-state.js as fallback"
            SCRIPT="tests/load/steady-state.js"
          fi
          k6 run --out json=k6-results.json --summary-export k6-summary.json "$SCRIPT" \
            -e BASE_URL=http://localhost:3000
        continue-on-error: true

      - name: Generate SLO baseline report
        run: node scripts/ci/publish-load-baseline.mjs
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'smoke' }}

      - name: Write step summary
        run: cat docs/status/load-testing/slo-baseline-latest.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload k6 artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-results-${{ github.run_id }}
          path: |
            k6-results.json
            k6-summary.json
            docs/status/load-testing/slo-baseline-latest.md
          retention-days: 90
