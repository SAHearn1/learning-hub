name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"

jobs:
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard against tracked env files
        run: |
          TRACKED_ENV=$(git ls-files '*.env' '.env.*' '*.env.local' '.env.local' '.env.production' '.env.staging' | grep -v '.env.example' || true)
          if [ -n "$TRACKED_ENV" ]; then
            echo "::error::Tracked environment files found: $TRACKED_ENV"
            exit 1
          fi
          echo "No tracked environment files found."

  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootwork_test
          POSTGRES_USER: rootwork
          POSTGRES_PASSWORD: rootwork_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rootwork"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_test?schema=public
      DIRECT_URL: postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_test?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

  test:
    name: Unit Tests with Coverage
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests with coverage
        run: npm run test:coverage || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootwork_test
          POSTGRES_USER: rootwork
          POSTGRES_PASSWORD: rootwork_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rootwork"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_test?schema=public
      DIRECT_URL: postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_test?schema=public
      REDIS_URL: redis://localhost:6379
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      OPENAI_API_KEY: sk-openai-placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      N8N_WEBHOOK_SECRET: test_webhook_secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Seed test database
        run: npm run db:seed

      - name: Run integration tests
        run: npm run test:integration

  compliance-check:
    name: Compliance Workflow Check
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      DATABASE_URL: postgresql://placeholder
      DIRECT_URL: postgresql://placeholder
      OPENAI_API_KEY: sk-openai-placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      CLERK_SECRET_KEY: sk_test_placeholder
      STRIPE_SECRET_KEY: sk_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Validate compliance artifacts
        run: npm run compliance:check

  migrate-check:
    name: Migration Integrity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rootwork_migrate
          POSTGRES_USER: rootwork
          POSTGRES_PASSWORD: rootwork_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U rootwork"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_migrate?schema=public
      DIRECT_URL: postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_migrate?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Create shadow database for diff
        run: PGPASSWORD=rootwork_ci psql -h localhost -U rootwork -d postgres -c "CREATE DATABASE rootwork_shadow;"

      - name: Verify schema is in sync
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url postgresql://rootwork:rootwork_ci@localhost:5432/rootwork_shadow?schema=public --exit-code

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Audit for critical vulnerabilities
        run: npm audit --audit-level=critical || true

      - name: Check for outdated dependencies
        run: npm outdated --long || true
